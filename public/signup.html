<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>회원가입 - 날씨 뉴스</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<nav class="navbar navbar-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            🌤 날씨 뉴스
        </a>

    </div>

</nav>


<div class="signup-container">

    <div class="form-card">

        <h2 class="text-center mb-4">
            회원가입
        </h2>


        <form id="signupForm">


            <div class="mb-3">

                <label class="form-label">
                    아이디
                </label>

                <input
                    type="text"
                    id="userID"
                    class="form-control"
                    minlength="4"
                    maxlength="20"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    비밀번호
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    minlength="8"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    이름
                </label>

                <input
                    type="text"
                    id="name"
                    class="form-control"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    이메일
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    전화번호
                </label>

                <input
                    type="tel"
                    id="phoneNumber"
                    class="form-control"
                    placeholder="01012345678"
                >

            </div>


            <div class="mb-4">

                <label class="form-label">
                    성별
                </label>

                <select
                    id="gender"
                    class="form-select"
                    required
                >

                    <option value="">
                        선택하세요
                    </option>

                    <option value="Male">
                        남성
                    </option>

                    <option value="Female">
                        여성
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                회원가입
            </button>


        </form>

    </div>

</div>


<script src="/js/signup.js"></script>

</body>

</html>
