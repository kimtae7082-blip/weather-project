<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>로그인 - 날씨 뉴스</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<nav class="navbar navbar-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            🌤 날씨 뉴스
        </a>

    </div>

</nav>


<div class="login-container">

    <div class="form-card">

        <h2 class="text-center mb-4">
            로그인
        </h2>


        <form id="loginForm">


            <div class="mb-3">

                <label class="form-label">
                    아이디
                </label>

                <input
                    type="text"
                    id="userID"
                    class="form-control"
                    required
                >

            </div>


            <div class="mb-4">

                <label class="form-label">
                    비밀번호
                </label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                로그인
            </button>


        </form>


        <div class="text-center mt-4">

            <a href="/signup.html">
                회원가입
            </a>

        </div>

    </div>

</div>


<script src="/js/login.js"></script>

</body>

</html>
