<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>마이페이지 - 날씨 뉴스</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<nav class="navbar navbar-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="/"
        >
            🌤 날씨 뉴스
        </a>

        <button
            class="btn btn-danger btn-sm"
            onclick="logout()"
        >
            로그아웃
        </button>

    </div>

</nav>


<div class="mypage-container">

    <div class="form-card">

        <h2 class="mb-4">
            마이페이지
        </h2>


        <div id="userInfo"></div>


        <hr class="my-4">


        <h4 class="mb-3">
            ⭐ 내 관심지역
        </h4>


        <div id="favoriteList">

        </div>


        <hr class="my-4">


        <h4 class="mb-3">
            관심지역 추가
        </h4>


        <div class="input-group">

            <select
                id="citySelect"
                class="form-select"
            >

            </select>


            <button
                id="addFavoriteBtn"
                class="btn btn-primary"
            >
                추가
            </button>

        </div>

    </div>

</div>


<script src="/js/common.js"></script>
<script src="/js/mypage.js"></script>

</body>

</html>
