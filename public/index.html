<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>날씨 뉴스 앱</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<nav class="navbar navbar-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="/"
        >
            🌤 날씨 뉴스
        </a>

        <div id="loginArea"></div>

    </div>

</nav>


<section class="hero">

    <div class="container">

        <div class="hero-card text-center">

            <span class="badge badge-provider mb-3">
                Open-Meteo
            </span>

            <h1 class="display-5 fw-bold">
                대한민국 날씨 뉴스
            </h1>

            <p class="lead">
                서울 · 부산 · 인천 · 대구 · 대전 · 광주
            </p>

            <button
                id="btnFetchAll"
                class="btn btn-primary btn-lg"
            >
                전체 날씨 조회
            </button>

            <button
                id="btnSaveWeather"
                class="btn btn-success btn-lg ms-2"
            >
                날씨 DB 저장
            </button>

        </div>

    </div>

</section>


<main class="container pb-5">

    <h2 class="section-title">
        현재 날씨
    </h2>

    <div
        id="weatherResult"
        class="row g-4"
    >

    </div>


    <section class="mt-5">

        <h2 class="section-title">
            날씨 뉴스
        </h2>

        <div class="news-card">

            <h4>
                🌤 오늘의 날씨
            </h4>

            <p class="mb-0">
                전국 주요 도시의 현재 날씨를 확인하세요.
                관심지역은 로그인 후 등록할 수 있습니다.
            </p>

        </div>

    </section>

</main>


<footer>

    <p class="mb-0">
        Weather News App
    </p>

</footer>


<script src="/js/common.js"></script>
<script src="/js/weather.js"></script>

</body>

</html>
